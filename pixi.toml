[workspace]
authors = ["Karl Theodor Ruby <karl.ruby@tuta.com>"]
channels = ["conda-forge", "https://conda.modular.com/max", "https://repo.prefix.dev/modular-community"]
name = "mojo-create"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
create = "mojo run -I src"
test = "bash -c 'set -e; export SDL_AUDIO_DRIVER=dummy; for f in $(find tests -name \"test_*.mojo\" | sort); do mojo run -I src \"$f\"; done'"
precompile = "mkdir -p build && mojo precompile src/create -o build/create.mojoc"
setup = "git config core.hooksPath .githooks"

[dependencies]
mojo = ">=1.0.0,<2"
mojo-window = ">=0.1.2,<0.2"
sdl3 = ">=3.4,<4"
freetype = ">=2.13,<3"
libpng = ">=1.6,<2"
libjpeg-turbo = ">=3,<4"
libsndfile = ">=1.2,<2"
