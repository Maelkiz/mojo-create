[workspace]
authors = ["Karl Theodor Ruby <karl.ruby@tuta.com>"]
channels = ["https://conda.modular.com/max", "conda-forge", "file:///home/karl/Git/mojo-window/output"]
name = "mojo-create"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
create = "mojo run -I src"
test = "bash -c 'set -e; for f in $(find tests -name \"test_*.mojo\" | sort); do mojo run -I src \"$f\"; done'"
setup = "git config core.hooksPath .githooks"

[dependencies]
mojo = ">=1.0.0,<2"
mojo-window = ">=0.1.1,<1"
sdl3 = ">=3.4,<4"
freetype = ">=2.13,<3"
libpng = ">=1.6,<2"
libjpeg-turbo = ">=3,<4"
